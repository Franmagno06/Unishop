# docker-compose.yml — só o banco; API e frontend rodam com npm run dev
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: unishop_dev
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - unishop_dev_data:/var/lib/postgresql/data

volumes:
  unishop_dev_data:
